<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="estoque.js" defer></script>
</head>
<body>

    <header>
        <h1>Sistema de Gestão de Estoque</h1>
        <p>Atividade prática de Arrays e DOM em JavaScript</p>
    </header>

    <main>
        <section class="painel">
            <h2>Categorias</h2>
            <div id="categorias"></div>
        </section>

        <section class="painel">
            <h2>Códigos e fornecedores</h2>
            <div id="codigos"></div>
            <div id="fornecedores"></div>
        </section>

        <section class="painel">
            <h2>Operações com Arrays</h2>
            <div id="operacoes"></div>
        </section>

        <section class="painel">
            <h2>Iteração</h2>
            <div id="iteracao"></div>
        </section>

        <section class="painel">
            <h2>Produtos em estoque</h2>
            <div id="produtos"></div>
        </section>

        <section class="painel">
            <h2>Resultados dos métodos</h2>
            <div id="resultados"></div>
        </section>
    </main>

    <footer>
        <p>Desenvolvimento Web - JavaScript, Arrays e DOM</p>
    </footer>

</body>
</html>
